# Build OpenWrt 25.12.6 for the JioRouter AX6000 JIDU6J01 family with openUF
# (UniFi adoption) baked in, so the device needs no internet after flashing.
#
#   Actions -> "Build JIDU6J01 openUF firmware" -> Run workflow
#
# Secret (Settings -> Secrets and variables -> Actions):
#   ROOT_PASSWORD   root password for LuCI/SSH; only its SHA-512 hash goes in
#                   the image. Without it, root has no password after flashing.
name: Build JIDU6J01 openUF firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt release (25.12.6 = newest; 25.12-SNAPSHOT = branch head)"
        default: "25.12.6"
        required: true
      openuf_ref:
        description: "openUF branch/tag/commit (yesrab/openUF)"
        default: "main"
        required: true
      country:
        description: "Wi-Fi country code"
        default: "US"
        required: true
      hostname:
        description: "Hostname"
        default: "JIDU6J01-AP"
        required: true
      address:
        description: "Management address: dhcp, or static like 10.0.0.10/24"
        default: "dhcp"
        required: true
      gateway:
        description: "Gateway (static address only)"
        default: ""
      dns:
        description: "DNS servers, space separated (static address only)"
        default: ""
      inform_url:
        description: "Optional: http://<controller-ip>:8080/inform (blank = L2 discovery)"
        default: ""
  push:
    branches: [main]
    paths: ["files/**", "scripts/**", ".github/workflows/build.yml"]

env:
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: jiorouter_ax6000-jidu6j01

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Settings
        id: s
        run: |
          set -eu
          V="${{ inputs.openwrt_version || '25.12.6' }}"
          BASE="https://downloads.openwrt.org/releases/$V/targets/$TARGET/$SUBTARGET"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          curl -fsSL "$BASE/sha256sums" -o sha256sums
          curl -fsSL "$BASE/profiles.json" -o profiles.json
          IB=$(grep -o 'openwrt-imagebuilder-[^ ]*Linux-x86_64.tar.zst' sha256sums | head -1)
          echo "ib=$IB" >> "$GITHUB_OUTPUT"
          # The device must exist in this release, with the five variants.
          jq -e --arg p "$PROFILE" '.profiles[$p]' profiles.json > profile.json
          jq -r '.titles[] | "\(.vendor) \(.model) \(.variant)"' profile.json
          jq -r '"default packages: " + (.device_packages|join(" "))' profile.json
          echo "commit=$(jq -r .version_code profiles.json)" >> "$GITHUB_OUTPUT"

      # ── 1. openUF (openuf, luci-app-openuf, luci-theme-halo) ─────────────────
      - name: Fetch openUF and build its source archive
        id: ouf
        run: |
          set -eu
          git clone https://github.com/yesrab/openUF.git openUF
          cd openUF
          git checkout "${{ inputs.openuf_ref || 'main' }}"
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          N=$(git rev-list --count "$TAG"..HEAD)
          VER=${TAG#v}; [ "$N" = 0 ] || VER="$VER.$N"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 liblua5.1-dev lua-bitop luarocks dash zstd squashfs-tools jq
          sudo ln -sf /usr/bin/lua5.1 /usr/local/bin/lua
          sudo luarocks --lua-version 5.1 install lua-cjson LUA_INCDIR=/usr/include/lua5.1
          sh tools/release-archive.sh "$VER"      # runs openUF's test suite too
          ls -d build/release/openuf-$VER/openuf

      # openuf, luci-app-openuf and luci-theme-halo are architecture-independent
      # Lua/JS/CSS with nothing to compile. They are laid into the image exactly
      # where their package Makefiles (and luci.mk) install them; their
      # dependencies come prebuilt from the official 25.12.6 feed (packages.txt).
      # (Building them with the SDK recompiled lua/luabitop/lua-openssl from
      # source and failed; their postinst scripts do nothing at image time.)
      - name: Stage openUF, luci-app-openuf, luci-theme-halo into the image
        run: |
          set -eu
          VER=${{ steps.ouf.outputs.ver }}
          SRC=openUF/build/release/openuf-$VER/openuf
          F=files
          L=$F/usr/lib/openuf
          install -d $L/lib $L/modelmap $L/ufmodel $L/hook $F/usr/bin $F/usr/sbin \
                     $F/etc/init.d $F/etc/config $F/etc/openuf $F/lib/upgrade/keep.d
          install -m644 $SRC/*.lua $L/
          [ -f $SRC/BUILD ] && install -m644 $SRC/BUILD $L/
          echo "$VER" > $L/VERSION
          install -m644 $SRC/lib/*.lua $L/lib/
          install -m644 $SRC/modelmap/*.lua $L/modelmap/
          install -m644 $SRC/ufmodel/*.lua $L/ufmodel/
          install -m644 $SRC/hook/*.lua $L/hook/
          install -m755 $SRC/hook/*.sh $L/hook/
          ln -sf ../lib/openuf/hook/syswrapper.sh $F/usr/bin/syswrapper.sh
          ln -sf ../lib/openuf/hook/openuf-cli.sh $F/usr/bin/openuf
          ln -sf ../lib/openuf/hook/openuf-convert.sh $F/usr/sbin/openuf-convert
          ln -sf ../lib/openuf/hook/openuf-deps.sh $F/usr/sbin/openuf-deps
          install -m755 $SRC/etc/init.d/openuf $F/etc/init.d/openuf
          install -m644 openUF/package/openuf/files/openuf.config $F/etc/config/openuf
          install -m644 openUF/package/openuf/files/openuf.upgrade $F/lib/upgrade/keep.d/openuf
          # LuCI app + theme, luci.mk layout: htdocs -> /www, root -> /, ucode -> /usr/share/ucode/luci
          for P in luci-app-openuf luci-theme-halo; do
            D=openUF/package/$P
            [ -d $D/htdocs ] && { install -d $F/www; cp -a $D/htdocs/. $F/www/; }
            [ -d $D/root ]   && cp -a $D/root/. $F/
            [ -d $D/ucode ]  && { install -d $F/usr/share/ucode/luci; cp -a $D/ucode/. $F/usr/share/ucode/luci/; }
          done
          chmod 755 $F/etc/uci-defaults/* $F/etc/init.d/*
          # services enabled at first boot by our uci-defaults (openuf, lldpd)
          find $F -type f | sort | head -80; echo "... $(find $F -type f | wc -l) files"

      # ── 2. Image ─────────────────────────────────────────────────────────────
      - name: OpenWrt ImageBuilder (${{ steps.s.outputs.ver }})
        run: |
          set -eu
          curl -fsSL "${{ steps.s.outputs.base }}/${{ steps.s.outputs.ib }}" -o ib.tar.zst
          SUM=$(awk -v f="${{ steps.s.outputs.ib }}" '$2==f || $2=="*"f {print $1}' sha256sums)
          echo "$SUM  ib.tar.zst" | sha256sum -c -
          mkdir ib && tar --zstd -xf ib.tar.zst -C ib --strip-components=1

      - name: First-boot settings
        env:
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
        run: |
          set -eu
          q() { printf "%s='%s'\n" "$1" "$(printf '%s' "$2" | sed "s/'/'\\\\''/g")"; }
          CC=$(echo "${{ inputs.country || 'US' }}" | tr a-z A-Z)
          echo "$CC" | grep -qE '^[A-Z]{2}$' || { echo "bad country code"; exit 1; }
          mkdir -p files/etc/openuf
          {
            q COUNTRY   "$CC"
            q HOSTNAME  "${{ inputs.hostname || 'JIDU6J01-AP' }}"
            q ADDRESS   "${{ inputs.address || 'dhcp' }}"
            q GATEWAY   "${{ inputs.gateway }}"
            q DNS       "${{ inputs.dns }}"
            q INFORM_URL "${{ inputs.inform_url }}"
            q TIMEZONE_NAME "Asia/Kolkata"
            q TIMEZONE  "IST-5:30"
          } > files/etc/openuf/firstboot.conf
          cat files/etc/openuf/firstboot.conf
          if [ -n "${ROOT_PASSWORD:-}" ]; then
            printf '%s' "$ROOT_PASSWORD" | openssl passwd -6 -stdin > files/etc/openuf/.root-hash
            chmod 600 files/etc/openuf/.root-hash
            echo "root password: hash baked in"
          else
            echo "::warning::ROOT_PASSWORD secret not set - root will have NO password after flashing"
          fi
          cat > files/etc/openuf/build-info <<EOF
          openwrt=${{ steps.s.outputs.ver }} (${{ steps.s.outputs.commit }})
          profile=$PROFILE
          openuf=${{ steps.ouf.outputs.ver }} (yesrab/openUF ${{ steps.ouf.outputs.commit }})
          built=$(date -u +%Y-%m-%dT%H:%MZ) by $GITHUB_REPOSITORY run $GITHUB_RUN_ID
          EOF

      - name: Build image
        working-directory: ib
        run: |
          set -eu
          PKGS="$(grep -v '^#' ../packages.txt | tr '\n' ' ')"
          echo "PACKAGES=$PKGS"
          make image PROFILE="$PROFILE" PACKAGES="$PKGS" FILES="$GITHUB_WORKSPACE/files" \
            EXTRA_IMAGE_NAME=openuf
          mkdir -p ../out
          cp -v bin/targets/$TARGET/$SUBTARGET/*openuf*  ../out/
          cd ../out && sha256sum * > sha256sums && cat sha256sums

      # ── 3. Audit ─────────────────────────────────────────────────────────────
      - name: Audit image (offline completeness, hardening, CVE versions)
        run: |
          set -eu
          mkdir -p x && tar -xf out/*sysupgrade.bin -C x
          ROOTFS=$(find x -name root -type f | head -1)
          sudo unsquashfs -no-progress -d rootfs "$ROOTFS" >/dev/null
          sudo chown -R "$(id -u)" rootfs
          bash scripts/audit-image.sh rootfs out/*.manifest out/AUDIT.md || AUDIT_FAIL=1
          cat out/AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          cat files/etc/openuf/build-info >> "$GITHUB_STEP_SUMMARY"
          [ -z "${AUDIT_FAIL:-}" ]

      - name: CVE scan of binaries (cve-bin-tool, informational)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          pip install --quiet cve-bin-tool
          cve-bin-tool -n json-mirror -f md -o out/CVE-SCAN.md rootfs || true
          [ -f out/CVE-SCAN.md ] && { echo "## cve-bin-tool"; head -150 out/CVE-SCAN.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: jidu6j01-openwrt-${{ steps.s.outputs.ver }}-openuf-${{ steps.ouf.outputs.ver }}
          path: |
            out/*sysupgrade.bin
            out/*initramfs*
            out/*.manifest
            out/sha256sums
            out/AUDIT.md
            out/CVE-SCAN.md
          if-no-files-found: warn
